name: Publish bridge to npm

# Publishes whenever package.json's version has not been published yet.
on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "spec=$name@$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm ci
      - if: steps.version.outputs.published == 'false'
        run: npm run check && npm test
      - if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
